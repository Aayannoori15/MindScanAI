services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindscan
      POSTGRES_PASSWORD: mindscan
      POSTGRES_DB: mindscan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://mindscan:mindscan@postgres:5432/mindscan
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend/models:/app/backend/models

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_PROXY: http://backend:8000

volumes:
  pgdata:
